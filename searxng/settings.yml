use_default_settings: true

server:
  secret_key: "change-me-to-a-random-string"
  limiter: false        # private instance, no rate limiter
  image_proxy: false


hostnames:
  remove:
    - '(.*\.)?huggingface\.co$'
    - '(.*\.)?github\.com$'
    - '(.*\.)?arxiv\.org$'

search:
  formats:
    - html
    - json

engines:
  - name: brave
    disabled: false
  - name: bing
    disabled: false
  - name: wikipedia
    disabled: false
  - name: google
    disabled: false

outgoing:
  request_timeout: 1.2        # per-engine timeout, keeps slow engines from stalling
  max_request_timeout: 1.8
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true